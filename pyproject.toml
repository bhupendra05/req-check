[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "req-check"
version = "0.1.0"
description = "Verify that your codebase actually implements your spec — powered by Claude Opus 4.7."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bhupendra Gurjar", email = "bgurjar05.bg@gmail.com" }]
keywords = ["spec", "requirements", "verification", "audit", "llm", "claude", "anthropic", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "anthropic>=0.40.0",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
req-check = "reqcheck.cli:main"

[project.urls]
Homepage   = "https://github.com/bhupendra05/req-check"
Repository = "https://github.com/bhupendra05/req-check"
Issues     = "https://github.com/bhupendra05/req-check/issues"

[tool.setuptools.packages.find]
include = ["reqcheck*"]
